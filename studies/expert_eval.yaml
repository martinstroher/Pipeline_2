# Expert-Evaluation Study Configuration — PreSaltOntoLearn
#
# Instructions sheet rendered as the first tab of the expert-evaluation
# workbook produced by src/evaluation/expert_eval_generator.py. Each entry
# is a [Section, Details] pair shown verbatim.
#
# The workbook contains one instructions sheet, one representation sheet,
# one category sheet, and five final-ontology sheets. Only the prose lives
# here. Authors retargeting the pipeline rewrite this file to swap anchors,
# calibration examples, and project name.
#
# Load order: src/utils/study_config.py reads this file and exposes
# `get_study_config().instruction_rows` to the workbook generator.

instructions_sheet:
  rows:
    - ["EXPERT EVALUATION - PreSaltOntoLearn", ""]
    - ["", ""]
    - ["PURPOSE", "Evaluate geological representations and the final Pre-Salt knowledge model. The representation tasks are blinded; do not try to identify which system produced an item."]
    - ["STUDY DESIGN", "All experts receive the same sampled items in a different order. Definition 1 and Definition 2 are independently swapped for each expert."]
    - ["GENERAL RULE", "Judge only the proposal shown in each row. You do not need to reconstruct the complete ontology or suggest an alternative from a hidden list. Use Notes for an optional short explanation, especially for Partial or No."]
    - ["UNSURE", "Choose Unsure when you lack enough expertise, the meaning is ambiguous, or the available information conflicts. Choose Partial when you can judge the item and it is only partly correct. Representation ratings also include an explicit Unsure option."]
    - ["", ""]
    - ["SHEET: REPRESENTATION", ""]
    - ["Task", "For each term, rate its Pre-Salt relevance based on the term and your geological knowledge, not on definition quality. Then rate Definition 1 and Definition 2 independently and choose the better definition, Tie, or Unsure."]
    - ["", ""]
    - ["Relevance 1 - Not relevant", "The term has no meaningful connection to Brazilian Pre-Salt petroleum geology."]
    - ["Relevance 2 - Marginal", "The term is only loosely connected or is too general to contribute much to the Pre-Salt model."]
    - ["Relevance 3 - Relevant", "The term is geologically applicable to the Pre-Salt setting."]
    - ["Relevance 4 - Important", "The term is commonly needed to describe or compare Pre-Salt systems."]
    - ["Relevance 5 - Core", "The term is fundamental to understanding Brazilian Pre-Salt geology or reservoirs."]
    - ["", ""]
    - ["Quality 1 - Incorrect", "The definition contains a fundamental geological error or does not define the term."]
    - ["Quality 2 - Poor", "The definition has major inaccuracies, serious imprecision, or omits the essential kind of thing."]
    - ["Quality 3 - Acceptable", "The definition is broadly correct but has notable gaps or minor inaccuracies."]
    - ["Quality 4 - Good", "The definition is accurate and useful, with only minor issues."]
    - ["Quality 5 - Excellent", "The definition is precise, geologically sound, and captures the term's essential meaning in the Pre-Salt context."]
    - ["Preference", "Choose 1, 2, Tie, or Unsure after rating both definitions independently."]
    - ["", ""]
    - ["SHEET: CATEGORY_CORRECT", ""]
    - ["Task", "Judge whether each term belongs in the proposed category. The same term may appear with different proposed categories; this repetition is intentional, and each proposal must be judged independently."]
    - ["Evidence boundary", "Use the term and category description only. Definitions and retrieved passages are intentionally hidden so every condition is judged under the same evidence."]
    - ["No alternative required", "You are not shown the complete category vocabulary and are not expected to select a replacement. For Partial or No, use Notes only when a brief geological explanation would help."]
    - ["Leave unclassified", "Evaluate this proposal too. Mark Yes when the term is outside scope or not a reusable geological concept. Mark No when it is a meaningful Pre-Salt concept that should receive some category; you do not need to name that category."]
    - ["", ""]
    - ["Yes", "The proposed category correctly captures the kind of geological entity, process, property, or other item represented by the term."]
    - ["Partial", "The proposal is in the right direction but is too broad, too narrow, or otherwise imprecise."]
    - ["No", "The proposed category is geologically wrong for the term."]
    - ["", ""]
    - ["SHEET: TAXONOMY", ""]
    - ["Relationship task", "Answer whether the child concept is genuinely a type of the proposed parent concept."]
    - ["Usefulness task", "Separately answer whether a Pre-Salt geologist or model needs this distinction to understand and compare Pre-Salt systems. Mark No when the distinction is too narrow or redundant for that purpose."]
    - ["No replacement required", "You are not shown the complete hierarchy and are not expected to choose another parent. Explain a Partial or No judgment in Notes only when useful."]
    - ["", ""]
    - ["SHEET: DEFINED_CLASSES", ""]
    - ["Overall definition", "Judge whether the proposed base kind and distinguishing feature together define the intended geological concept without making it too broad, too narrow, or wrong."]
    - ["Defining feature", "Separately answer whether the proposed feature genuinely distinguishes this concept from its base kind across the Pre-Salt domain, rather than describing only one local occurrence or paper."]
    - ["", ""]
    - ["SHEET: RELATIONS", ""]
    - ["Statement task", "Judge whether the geological statement connecting the subject and related concept is correct."]
    - ["Scope task", "Separately judge whether it is generally true for the concept, rather than true only in a particular field, formation, interval, sample, or study."]
    - ["Corpus excerpt", "The excerpt appears after the judgment columns and is context only. It may be incomplete or locally specific; base the judgment on geological knowledge."]
    - ["", ""]
    - ["SHEET: INDIVIDUALS", ""]
    - ["Named-entity task", "Judge whether the item is one specific named basin, field, formation, time interval, structure, or other particular entity rather than a reusable kind."]
    - ["Type task", "Judge whether the proposed geological type is correct. You are not shown the complete type vocabulary and do not need to select a replacement; explain in Notes only when useful."]
    - ["", ""]
    - ["SHEET: CRITIC_DECISIONS", ""]
    - ["Task", "The sheet shows the critic's decision and the resulting treatment after that decision. Judge whether this treatment is appropriate for a concise Pre-Salt core vocabulary."]
    - ["Exclusion", "Leaving a concept out does not mean it is geologically false; it means the distinction is too narrow, redundant, mixed, or low-value for this core model."]
    - ["Characteristic treatment", "Representing a term as a characteristic or relation keeps its information without treating it as a separate type of geological thing."]
    - ["Preferred treatment", "For every row, choose one complete option: keep as a separate concept; keep its information but not as a separate concept; leave it out; or Unsure."]
    - ["Decision versus treatment", "Decision Appropriate evaluates the critic decision and displayed after-state. Preferred Treatment records what you think should happen. If you prefer the same treatment for a different reason, explain that briefly in Notes."]
    - ["", ""]
    - ["CALIBRATION EXAMPLES", ""]
    - ["Category", "Grainstone proposed as Sedimentary Rock: Yes. Grainstone proposed as Geological Process: No."]
    - ["Taxonomy", "Grainstone as a type of Carbonate Rock: Yes. Grainstone as a type of Geological Process: No."]
    - ["Defined feature", "A reservoir rock distinguished by its capacity to store and transmit hydrocarbons uses a defining feature: Yes. A mineral association reported only in one named field is not a defining feature of the whole concept: No."]
    - ["Relation scope", "A statement observed only in one named field should not be marked generally true for every instance of the concept."]
    - ["Named entity", "Santos Basin is one named basin: Yes. Sedimentary basin is a reusable kind, not one named entity."]
    - ["", ""]
    - ["NOTES", "Use Notes for concise geological reasoning, especially for Partial or No judgments. Thank you for your expertise."]
