# Starter text for the current production prompts.
# Edit domain identity, questions, and examples for the intended subject.
# This neutral demonstration is structurally valid, not a reviewed domain.
# Double braces preserve JSON examples when callers use str.format().

domain:
  name: "your subject"
  scope: "the entities, processes, and qualities studied in your subject"
  upper_stack: "BFO"
  waterfall: "BFO"

personas:
  domain_expert: "You are a senior expert in <<domain_scope>> and ontology engineering."
  domain_extractor: "You are a senior expert in <<domain_scope>>. Extract core domain concepts from scientific texts for a domain ontology."
  upper_ontologist: "You are an ontology engineer with expertise in <<domain_upper_stack>> applied to <<domain_scope>>."
  critic_auditor: "<<personas_upper_ontologist>> Review candidate classes and relations. Propose an edit only when you can give a concrete reason grounded in the supplied evidence."
  scope_auditor: "You are an ontology scope auditor for <<domain_name>>. Determine which listed competency questions, if any, each term helps answer."

examples:
  term_extraction_focus: "Identify types of entities relevant to <<domain_scope>>."
  term_extraction_normalization: '"specimens" -> "Specimen", "processes" -> "Process"'
  term_extraction_exclusions: |
    * Author names, document identifiers, and numerical measurements.
    * Vague words that do not identify a domain concept.
  term_extraction_inclusions: "Include generic kinds of entities, processes, and qualities that the text discusses."
  term_extraction_named_individuals: "Include relevant named entities, such as a named study site. They are classified as individuals downstream."
  term_extraction_output: '["Specimen", "Container", "Heating", "Temperature"]'

  nld_generation: |
    Term: "Specimen"
    Context: A specimen is a portion of material selected for examination.
    Output: {{"Definition": "A specimen is a material entity that is selected for examination.", "Context_Used": true}}

    Term: "Heating"
    Context: No additional context available.
    Output: {{"Definition": "Heating is a process that increases the temperature of a material entity.", "Context_Used": false}}

  categorization_waterfall_steps: |
    3. Use the BFO categories in the supplied vocabulary. The starter has no domain-specific upper-ontology tier.
  categorization_fallback_hint: "A domain process may fit process, and a physical attribute may fit quality. Use only categories present in the supplied vocabulary."
  term_categorization: |
    Input: [{{"term": "Specimen", "nld": "A specimen is a material entity selected for examination."}}]
    Output: [{{"term": "Specimen", "category": "material entity", "reasoning": "The specimen is a portion of matter."}}]

    Input: [{{"term": "Heating", "nld": "Heating is a process that increases temperature."}}]
    Output: [{{"term": "Heating", "category": "process", "reasoning": "Heating unfolds over time."}}]

  taxonomy_case_note: "The configured BFO category labels are lowercase. Use the exact labels supplied in the vocabulary."
  taxonomy_individual_types: |
    Named entities such as "Study Site Alpha" are individuals: use rdf:type.
    Generic kinds such as "Specimen" and "Heating" are classes: use rdfs:subClassOf.
  taxonomy_shared_genus: |
    "Small Container" and "Large Container" can share "Container" as their genus
    when the supplied definitions support that parent. Do not invent unsupported distinctions.
  critic_named_individuals: 'Named entities, such as "Study Site Alpha", are individuals rather than generic classes.'

  # The loader builds this table from active relations with critic_menu: true.
  # Edit ontology_config.yaml to change the allowed properties or constraints.
  relation_property_table: "<<config_relation_property_table>>"
  relation_extraction: |
    Input: [{{"term": "Container", "nld": "A container is a material entity that has a lid as a part."}}]
    Output: [{{"term": "Container", "relations": [{{"property": "has_part", "filler": "Lid", "confidence": 1.0, "evidence": "has a lid as a part"}}]}}]

  # This is the question list read by the runtime. No separate text file is used.
  # Use unique identifiers from CQ1 through CQ10, and keep cq_identifiers aligned.
  cq_questions: |
    CQ1 - What entities are studied in this domain?
    CQ2 - What processes involve these entities?
    CQ3 - What qualities characterize these entities?
  cq_identifiers: "CQ1, CQ2, CQ3"
  # This block is inserted in the system instruction, which is not str.format()'d.
  cq_scoring: |
    Term: "Specimen"
    NLD: "A specimen is a material entity selected for examination."
    Output: [{"term": "Specimen", "relevant_cqs": ["CQ1"], "reasoning": "It identifies an entity studied in the domain."}]

    Term: "Unrelated Topic"
    NLD: "This topic is outside the stated domain."
    Output: [{"term": "Unrelated Topic", "relevant_cqs": [], "reasoning": "It does not help answer the listed questions."}]
  cq_scoring_output: |
    [{{"term": "Specimen", "relevant_cqs": ["CQ1"], "reasoning": "It identifies an entity studied in the domain."}}]
