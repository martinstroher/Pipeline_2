# =========================================================================
# Ontology configuration — BFO categories with shared BFO/RO relations
# =========================================================================
# Single source of truth for ontology scope, namespaces, and per-class
# metadata. Edit this file (NOT Python code) to retarget the pipeline.
#
# This template ships with BFO categories and 61 generic BFO/RO relation
# entries from ../_shared/bfo_ro_relations.yaml, including their metatype
# groups, critic-menu flags, and mereology specialization rules.
# Only domain-specific relations need to be authored locally.
# To layer in more class ontologies (e.g. GeoCore, GeoReservoir, OBO
# Foundry ontologies), copy the
# `bfo:` block under `ontologies:`, point it at your OWL file under
# `resources/`, list its classes, and add its key to `waterfall:` in
# the desired priority order (most specific → most generic).
#
# Env var overrides:
#   ONTOLOGY_CONFIG_PATH        — path to this file (set in .env)
#   RELATION_PROVENANCE_TIERS   — comma-separated tier names (default: all)
# =========================================================================

# -------------------------------------------------------------------------
# Project identity — appears in OWL header, file names, log output.
# -------------------------------------------------------------------------
project:
  # REPLACE — short identifier (also used as OWL ontology label).
  name: "MyDomainOntology"
  # REPLACE — one-line description.
  description: "An LLM-generated ontology for my domain."
  # REPLACE — base IRI for your classes. Must end with `#` or `/`.
  namespace: "https://example.org/my-domain#"
  # REPLACE — short prefix for Turtle output (lowercase, no spaces).
  prefix: "mydom"
  version: "0.1.0"
  long_description: >
    A RAG-augmented LLM-generated ontology. Generated by the
    PreSaltOntoLearn pipeline.

# -------------------------------------------------------------------------
# Relation provenance tiers active at runtime. Applies to both shared
# defaults and local domain-specific entries.
# -------------------------------------------------------------------------
provenance_tiers_active:
  - owl_axiom
  - bfo_shape_axiom
  - ro_release
  - critic_minted

# -------------------------------------------------------------------------
# Waterfall — Step 5 categorisation cascade order.
# Most specific → most general. Every key here MUST have at least one
# class in `ontologies:` below with a `metatypes:` set.
# -------------------------------------------------------------------------
waterfall:
  - bfo

# -------------------------------------------------------------------------
# Ontologies in scope.
# Each key under `ontologies:` is referenced by `waterfall:` (above) and
# by any `relations:` entry's `iri`. Classes used as Step-5 categories
# need `metatypes:`; structural ancestors (the upper backbone) can omit
# metatypes — they will be emitted in the OWL but not offered to the
# Step-5 LLM as classification choices.
# -------------------------------------------------------------------------
ontologies:

  bfo:
    display_name: "BFO"
    # Path relative to this config. The scaffold script copies
    # bfo-core.owl from domains/presalt/resources/ into resources/ for you.
    owl: "resources/bfo-core.owl"
    namespace: "http://purl.obolibrary.org/obo/"
    prefix: "bfo"
    import_iri: "http://purl.obolibrary.org/obo/bfo.owl"
    eval_tier: "bfo"
    classes:
      # Upper backbone — present so the OWL exporter can anchor parents.
      # No metatypes ⇒ not offered as a Step-5 category.
      - label: "entity"
        iri_fragment: "BFO_0000001"
        llm_definition: "An entity is anything that exists, has existed, or will exist."
      - label: "continuant"
        iri_fragment: "BFO_0000002"
        llm_definition: "A continuant is an entity that persists, endures, or continues to exist through time while maintaining its identity."
      - label: "occurrent"
        iri_fragment: "BFO_0000003"
        llm_definition: "An occurrent is an entity that unfolds itself in time, or is the start, end, or boundary of such an entity."

      # Leaf categories — these ARE offered to the Step-5 LLM.
      - label: "material entity"
        iri_fragment: "BFO_0000040"
        metatypes: ["MaterialEntity", "IndependentContinuant"]
        llm_definition: "A material entity is an independent continuant that has matter as part."
      - label: "process"
        iri_fragment: "BFO_0000015"
        metatypes: ["Process", "Occurrent"]
        llm_definition: "A process is an occurrent that has temporal proper parts and depends on some material entity."
      - label: "quality"
        iri_fragment: "BFO_0000019"
        metatypes: ["Quality", "SpecificallyDependentContinuant"]
        llm_definition: "A quality is a specifically dependent continuant that, in contrast to roles and dispositions, does not require any further process to be realized."
      - label: "role"
        iri_fragment: "BFO_0000023"
        metatypes: ["Role", "SpecificallyDependentContinuant"]
        llm_definition: "A role is a realizable entity that exists because the bearer is in some special circumstances and is not such that, if it ceases to exist, then the bearer would cease to exist."
      - label: "disposition"
        iri_fragment: "BFO_0000016"
        metatypes: ["Disposition", "SpecificallyDependentContinuant"]
        llm_definition: "A disposition is a realizable entity such that, if it ceases to exist, then its bearer is physically changed."
      - label: "site"
        iri_fragment: "BFO_0000029"
        metatypes: ["Site", "ImmaterialEntity", "IndependentContinuant"]
        llm_definition: "A site is a three-dimensional immaterial entity that is bounded by material entities."
      - label: "function"
        iri_fragment: "BFO_0000034"
        metatypes: ["Function", "SpecificallyDependentContinuant"]
        llm_definition: "A function is a disposition that exists because the bearer is of a kind that, in being of that kind, has the disposition."

  # Property supplier only — not part of the categorization waterfall.
  ro:
    owl: "resources/ro-core.owl"
    namespace: "http://purl.obolibrary.org/obo/"
    prefix: "obo"
    eval_tier: "ro"
    import_iri: null
    classes: []

# -------------------------------------------------------------------------
# Verifier prefixes — used by Step 7b to recognise "upper-ontology" IRIs.
# Add any ontology you list above whose IRIs use a non-default prefix.
# -------------------------------------------------------------------------
verifier_prefixes:
  bfo: "http://purl.obolibrary.org/obo/"

# -------------------------------------------------------------------------
# Shared relation defaults — relative to this config, not the working
# directory. Keep domains/_shared/ alongside your domain when relocating.
# The loader uses safe YAML; this is a single fragment, not a YAML !include
# tag or recursive config inheritance. See domains/README.md for merge rules.
# -------------------------------------------------------------------------
relation_defaults: "../_shared/bfo_ro_relations.yaml"

# Optional custom shorthand. Shared BFO groups are already populated.
metatype_groups: {}

# -------------------------------------------------------------------------
# Local relations — ADD ONLY your domain-specific properties here.
# An empty local mapping retains all 61 shared BFO/RO entries at runtime.
# Each entry needs iri, domain, range, and explicit provenance; inverse,
# notes, and critic_menu are optional. Same-name entries replace the whole
# shared entry; prefer new names unless deliberately overriding a constraint.
# domains/presalt/ontology_config.yaml adds only its 10 geology properties.
# -------------------------------------------------------------------------
relations: {}

# -------------------------------------------------------------------------
# Property specialisations — inherited from shared defaults (has_part /
# part_of → continuant or occurrent variants). Omit to keep these rules.
# An explicit list replaces ALL inherited rules; [] disables specialization.
# -------------------------------------------------------------------------
# property_specializations: []

# -------------------------------------------------------------------------
# Reclassifier (Step 6d) tuning. Metatypes shared across many classes
# carry little discriminative signal and are excluded from "evidence"
# scoring when deciding whether to re-parent a term.
# -------------------------------------------------------------------------
non_distinguishing_metatypes:
  - Entity
  - Continuant
  - IndependentContinuant
  - Occurrent

weak_distinguishers:
  - Object
  - Process
  - Quality
  - Site
