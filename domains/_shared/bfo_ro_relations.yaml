# First matching rule wins. Mixed continuant/occurrent pairs stay generic
# so the relation validator can reject cross-category mereology.
property_specializations:
  - generic: has_part
    rules:
      - when: { subject_in: OCCURRENT, filler_in: OCCURRENT }
        specialize_to: has_occurrent_part
      - when: { subject_not_in: OCCURRENT, filler_not_in: OCCURRENT }
        specialize_to: has_continuant_part
  - generic: part_of
    rules:
      - when: { subject_in: OCCURRENT, filler_in: OCCURRENT }
        specialize_to: occurrent_part_of
      - when: { subject_not_in: OCCURRENT, filler_not_in: OCCURRENT }
        specialize_to: continuant_part_of
