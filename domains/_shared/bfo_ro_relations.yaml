# Shared BFO/RO relation defaults for BFO-grounded domains.
# Referenced by relation_defaults in each domain's ontology_config.yaml.
# 61 entries (44 BFO IRIs + 17 RO IRIs), including existing aliases.
# Keep relation order: consumers use it for critic menus and IRI label aliases.
# These groups and specialization rules travel with the relations so domain/
# range expansion does not depend on a new domain recreating the BFO shorthand.
# Add discipline-specific relations in the domain config, not here.

metatype_groups:
  CONTINUANT:
    - Continuant
    - IndependentContinuant
    - MaterialEntity
    - Object
    - Site
    - ImmaterialEntity
    - SpecificallyDependentContinuant
    - Quality
    - RelationalQuality
    - Disposition
    - GenericallyDependentContinuant
    - SpatialRegion
  OCCURRENT:
    - Occurrent
    - Process
    - ProcessBoundary
    - History
    - TemporalRegion
    - TemporalInstant
    - SpatiotemporalRegion
  ALL:
    - CONTINUANT
    - OCCURRENT
  MATERIAL:
    - MaterialEntity
    - Object
  INDEPENDENT_CONTINUANT:
    - IndependentContinuant
    - MaterialEntity
    - Object
    - Site
    - ImmaterialEntity
  IMMATERIAL:
    - ImmaterialEntity
    - Site
  PROCESS:
    - Process
    - ProcessBoundary
  PROCESS_STRICT:
    - Process
  SDC:
    - SpecificallyDependentContinuant
    - Quality
    - RelationalQuality
    - Disposition
    - Function
    - RealizableEntity
    - Role
  GDC:
    - GenericallyDependentContinuant
  QUALITY:
    - Quality
    - RelationalQuality
  DISPOSITION:
    - Disposition
    - Function
    - SpecificallyDependentContinuant
  REALIZABLE_ENTITY:
    - RealizableEntity
    - Role
    - Disposition
    - Function
    - SpecificallyDependentContinuant
  ROLE:
    - Role
    - RealizableEntity
    - SpecificallyDependentContinuant
  FUNCTION:
    - Function
    - Disposition
    - RealizableEntity
    - SpecificallyDependentContinuant
  TEMPORAL:
    - TemporalRegion
    - TemporalInstant
  TEMPORAL_INSTANT:
    - TemporalInstant
  SPATIOTEMPORAL:
    - SpatiotemporalRegion
  HISTORY:
    - History
  SPATIAL:
    - SpatialRegion
  SITE_OR_MATERIAL:
    - Site
    - ImmaterialEntity
    - MaterialEntity
    - Object
    - IndependentContinuant

