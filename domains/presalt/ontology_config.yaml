# -------------------------------------------------------------------------
# Non-distinguishing metatypes — upper-ontology agnostic
# -------------------------------------------------------------------------
# Metatypes too high-level to count as classification evidence. Typically
# the very top branches of the upper ontology (e.g., BFO Continuant /
# Occurrent, DOLCE Endurant / Perdurant). Consumers subtract these from
# candidate metatype sets when scoring "best more-specific category".
non_distinguishing_metatypes:
  - Continuant
  - Occurrent

# -------------------------------------------------------------------------
# Lateral coherence — domain-agnostic validate-step tuning
# -------------------------------------------------------------------------
# These settings control parsimony/facet-coherence auditing. They are expressed
# as generic ontology-policy knobs, never as Pre-Salt vocabulary rules.
lateral_coherence:
  enabled: true
  hints:
    enabled: true  # env override: LATERAL_HINTS_ENABLED=false
  class_worthiness:
    enabled: true  # env override: LATERAL_CLASS_WORTHINESS_ENABLED=false
    allow_defined_classes: true
    conservative_drop: false  # needs_review is diagnostic; valid core exclusions still apply
    min_confidence_apply: 0.70
    needs_review_below: 0.85
  frame_audit:
    enabled: true
  frame_completion:
    enabled: true  # env override: LATERAL_FRAME_COMPLETION_ENABLED=false
    auto_add: false  # diagnostics only unless explicitly enabled
    min_document_count: 2
    max_candidates_per_frame: 5
  reconciliation:
    enabled: true
    top_k: 3
  relation_scope:
    enabled: true  # env override: LATERAL_RELATION_SCOPE_ENABLED=false
    emit_only_generic_relations: true
    min_confidence_emit: 0.70
  disjointness:
    enabled: false  # enable after HermiT/Java is available and facet frames are stable
    require_same_facet_frame: true
    require_reasoner_validation: true
