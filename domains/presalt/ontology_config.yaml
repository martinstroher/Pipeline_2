# =========================================================================
# PreSaltOntoLearn — Ontology Configuration
# =========================================================================
# Single source of truth for upper-ontology scope, namespaces, and per-class
# metadata. Every consumer (taxonomy_builder, relation_validator,
# owl_exporter, ontology_verifier, and term_categorizer read this file via
# src/utils/ontology_config.py. The standalone evaluation study reads it as a
# frozen pipeline input.
#
# To add a class to the pipeline's scope: append an entry under the right
# ontology's `classes:` list. To change a namespace or import IRI: edit the
# ontology's top-level keys. To swap the project name: edit `project.name`.
# Changes apply on next pipeline run — no Python edits required.
#
# Env var overrides:
#   ONTOLOGY_CONFIG_PATH        — path to this file (default: ontology_config.yaml)
#   RELATION_PROVENANCE_TIERS   — comma-separated tier names (default: all)
#                                  e.g. "owl_axiom,bfo_shape_axiom,ro_release"
# =========================================================================

project:
  name: "PreSaltOntoLearn"
  description: "Pre-Salt Petroleum Geology Ontology"
  namespace: "https://w3id.org/presalt-onto#"
  prefix: "presalt"
  version: "0.1.0"
  long_description: >
    A RAG-augmented LLM-generated ontology for Brazilian Pre-Salt petroleum
    geology. Generated by the PreSaltOntoLearn pipeline.

# -------------------------------------------------------------------------
# Provenance tiers — controls which PROPERTY_CONSTRAINTS are active at runtime
# -------------------------------------------------------------------------
# Tiers (most → least authoritative):
#   owl_axiom       — reproduces published rdfs:domain / rdfs:range axioms
#                     from a local OWL file we load (bfo-core / geocore /
#                     geores). Highest authority.
#   bfo_shape_axiom — BFO 2020 spec shape constraint (e.g., part_of's
#                     category-parity rule) — published in spec, not
#                     expressible as a single rdfs:domain/range axiom.
#   ro_release      — sourced from OBO RO release (ro-core.owl).
#   critic_minted   — invented by the `validate` step when no published
#                     property fits; persisted to
#                     `output/validate_minted_properties.csv` and loaded
#                     on subsequent runs. Lowest authority; auditable.
#
# Env override `RELATION_PROVENANCE_TIERS=tier1,tier2` lets you run with a
# stricter subset (e.g. drop `critic_minted` for a no-invented-vocabulary
# baseline) without editing this file.
provenance_tiers_active:
  - owl_axiom
  - bfo_shape_axiom
  - ro_release
  - critic_minted

# -------------------------------------------------------------------------
# Waterfall classification order (most specific → most general)
# -------------------------------------------------------------------------
# Step 5 (term categorizer) and the ablation study cascade through these
# ontologies in order, falling through to the next tier only when no
# category in the current tier fits. `categorization_block()` renders the
# definitions of every listed ontology, in this order, into the
# {categories_block} prompt placeholder.
#
# Listed entries MUST appear as keys in `ontologies:` below and MUST have
# at least one class with a non-empty `metatypes` set. Property-only
# ontologies (e.g. ro) must NOT be listed here.
waterfall:
  - georeservoir
  - geocore
  - bfo

# -------------------------------------------------------------------------
# Ontologies in scope
# -------------------------------------------------------------------------
# Per-ontology keys:
#   owl                 — path to OWL/XML source file (relative to repo root)
#   namespace           — base namespace for class IRIs (prepended to iri_fragment)
#   prefix              — short prefix used in Turtle output
#   import_iri          — OWL import declaration target (optional)
#   classes[].label     — canonical category name (matches Step 5 output)
#   classes[].iri_fragment — local fragment appended to namespace
#   classes[].metatypes — BFO metatype set for relation validation
#                          (omitted for top-level ancestors not used as Categories)
#   classes[].llm_definition — one-line definition used as LLM prompt context
#                          (if omitted, loader extracts skos:definition from OWL,
#                           falls back to rdfs:comment, then to label)
# -------------------------------------------------------------------------

ontologies:

  # ─────────────────────────────────────────────────────────────────────
  bfo:
    display_name: "BFO"
    owl: "resources/bfo-core.owl"
    namespace: "http://purl.obolibrary.org/obo/"
    prefix: "bfo"
    import_iri: "http://purl.obolibrary.org/obo/bfo.owl"
    eval_tier: "bfo"
    classes:
      # Top-level abstract ancestors — present in UPPER_IRIS for taxonomy
      # backbone, but NOT used as final categories by the Step 5 categorizer
      # (no metatypes set ⇒ excluded from CATEGORY_TO_METATYPES).
      - label: "entity"
        iri_fragment: "BFO_0000001"
        llm_definition: "An entity is anything that exists or has existed or will exist. Examples: Julius Caesar; the Second World War; your body mass index; Verdi's Requiem."
      - label: "continuant"
        iri_fragment: "BFO_0000002"
        llm_definition: "A continuant is an entity that persists, endures, or continues to exist through time while maintaining its identity. Examples: A human being; a tennis ball; a cave; a region of space; someone's temperature."
      - label: "occurrent"
        iri_fragment: "BFO_0000003"
        llm_definition: "An occurrent is an entity that unfolds itself in time or it is the start or end of such an entity or it is a temporal or spatiotemporal region. Examples: As for process, history, process boundary, spatiotemporal region, zero-dimensional temporal region, one-dimensional temporal region, temporal interval, temporal instant.."

      # BFO categories used by Step 5 categorizer
      - label: "independent continuant"
        iri_fragment: "BFO_0000004"
        metatypes: [IndependentContinuant, Continuant]
        llm_definition: "b is an independent continuant =Def b is a continuant & there is no c such that b specifically depends on c or b generically depends on c."
      - label: "spatial region"
        iri_fragment: "BFO_0000006"
        metatypes: [SpatialRegion, Continuant]
        llm_definition: "A spatial region is a continuant entity that is a continuant part of the spatial projection of a portion of spacetime at a given time."
      - label: "temporal region"
        iri_fragment: "BFO_0000008"
        metatypes: [TemporalRegion, Occurrent]
        llm_definition: "A temporal region is an occurrent over which processes can unfold."
      - label: "spatiotemporal region"
        iri_fragment: "BFO_0000011"
        metatypes: [Occurrent]
        llm_definition: "A spatiotemporal region is an occurrent that is an occurrent part of spacetime."
      - label: "process"
        iri_fragment: "BFO_0000015"
        metatypes: [Process, Occurrent]
        llm_definition: "p is a process means p is an occurrent that has some temporal proper part and for some time t, p has some material entity as participant."
      - label: "disposition"
        iri_fragment: "BFO_0000016"
        metatypes: [Disposition, RealizableEntity, SpecificallyDependentContinuant, Continuant]
        categorizer: false  # realizable — introduced only by the validate-step critic, not Step 5
        llm_definition: "A disposition is a realizable entity whose realization occurs when its bearer is in some special physical circumstance, where this realization typically results from a corresponding change in the physical make-up of the bearer. Examples: the disposition of a glass to break when struck; the solubility of salt in water; the conductivity of copper."
      - label: "realizable entity"
        iri_fragment: "BFO_0000017"
        metatypes: [RealizableEntity, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A realizable entity is a specifically dependent continuant that inheres in some independent continuant which is not a spatial region and is of a type instances of which are realized in processes of a correlated type. Examples: the role of being a teacher; the function of a heart to pump blood; the disposition of glass to break."
      - label: "quality"
        iri_fragment: "BFO_0000019"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A quality is a specifically dependent continuant that, in contrast to roles and dispositions, does not require any further process in order to be realized."
      - label: "specifically dependent continuant"
        iri_fragment: "BFO_0000020"
        metatypes: [SpecificallyDependentContinuant, Continuant]
        llm_definition: "b is a specifically dependent continuant =Def b is a continuant & there is some independent continuant c which is not a spatial region & which is such that b specifically depends on c."
      - label: "role"
        iri_fragment: "BFO_0000023"
        metatypes: [Role, RealizableEntity, SpecificallyDependentContinuant, Continuant]
        categorizer: false  # realizable — introduced only by the validate-step critic, not Step 5
        llm_definition: "A role is a realizable entity whose instances are externally grounded — that is, they exist because of the relations between the bearer and other entities, and the bearer would not have the role were it not for these relations. Examples: the role of being a student; the role of source rock (a rock body in a petroleum system); the role of seal."
      - label: "fiat object part"
        iri_fragment: "BFO_0000024"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A fiat object part b is a material entity & such that if b exists then it is continuant part of some object c & demarcated from the remainder of c by one or more fiat surfaces."
      - label: "object aggregate"
        iri_fragment: "BFO_0000027"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An object aggregate is a material entity consisting exactly of a plurality (≥1) of objects as member parts which together form a unit."
      - label: "site"
        iri_fragment: "BFO_0000029"
        metatypes: [Site, ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A site is a three-dimensional immaterial entity whose boundaries either (partially or wholly) coincide with the boundaries of one or more material entities or have locations determined in relation to some material entity."
      - label: "object"
        iri_fragment: "BFO_0000030"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An object is a material entity which manifests causal unity & is of a type instances of which are maximal relative to the sort of causal unity manifested."
      - label: "generically dependent continuant"
        iri_fragment: "BFO_0000031"
        metatypes: [GenericallyDependentContinuant, Continuant]
        llm_definition: "A generically dependent continuant is an entity that exists in virtue of the fact that there is at least one of what may be multiple copies which is the content or the pattern that multiple copies would share."
      - label: "function"
        iri_fragment: "BFO_0000034"
        metatypes: [Function, Disposition, RealizableEntity, SpecificallyDependentContinuant, Continuant]
        categorizer: false  # realizable — introduced only by the validate-step critic, not Step 5
        llm_definition: "A function is a disposition that exists in virtue of the bearer's physical make-up and this physical make-up is something the bearer possesses because it came into being through processes of selection or design. Examples: the function of a heart to pump blood; the function of a key to open a specific lock."
      - label: "process boundary"
        iri_fragment: "BFO_0000035"
        metatypes: [Process, Occurrent]
        llm_definition: "p is a process boundary =Def p is a temporal part of a process & p has no proper temporal parts."
      - label: "one-dimensional temporal region"
        iri_fragment: "BFO_0000038"
        metatypes: [TemporalRegion, Occurrent]
        llm_definition: "A one-dimensional temporal region is a temporal region that is a whole that has a temporal interval and zero or more temporal intervals and temporal instants as parts."
      - label: "material entity"
        iri_fragment: "BFO_0000040"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A material entity is an independent continuant has some portion of matter as continuant part."
      - label: "continuant fiat boundary"
        iri_fragment: "BFO_0000140"
        metatypes: [ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A continuant fiat boundary b is an immaterial entity that is of zero, one or two dimensions & such that there is no time t when b has a spatial region as continuant part & whose location is determined in relation to some material entity."
      - label: "immaterial entity"
        iri_fragment: "BFO_0000141"
        metatypes: [ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "b is an immaterial entity =Def b is an independent continuant which is such that there is no time t when it has a material entity as continuant part."
      - label: "relational quality"
        iri_fragment: "BFO_0000145"
        metatypes: [RelationalQuality, Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "b is a relational quality =Def b is a quality & there exists c and d such that c and d are not identical & b specifically depends on c & b specifically depends on d."
      - label: "fiat surface"
        iri_fragment: "BFO_0000146"
        metatypes: [ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A fiat surface is a two-dimensional continuant fiat boundary that is self-connected."
    # BFO disjointness axioms (subject_iri_fragment, object_iri_fragment)
    # Asserted in the exported ontology to support reasoner consistency checks
    disjoint_pairs:
      - ["BFO_0000002", "BFO_0000003"]  # Continuant ⊥ Occurrent
      - ["BFO_0000004", "BFO_0000020"]  # IndependentContinuant ⊥ SDC
      - ["BFO_0000004", "BFO_0000031"]  # IndependentContinuant ⊥ GDC
      - ["BFO_0000020", "BFO_0000031"]  # SDC ⊥ GDC
      - ["BFO_0000040", "BFO_0000141"]  # MaterialEntity ⊥ ImmaterialEntity
      - ["BFO_0000019", "BFO_0000017"]  # Quality ⊥ RealizableEntity

  # ─────────────────────────────────────────────────────────────────────
  geocore:
    display_name: "GeoCore"
    owl: "resources/geocore-full.owl"
    namespace: "https://www.inf.ufrgs.br/bdi/ontologies/"
    prefix: "geocore"
    eval_tier: "geocore"
    classes:
      - label: "Geological Object"
        iri_fragment: "GEOCORE_0000001"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A rigid entity that provides its own identity criteria and holds a unity criteria. A Geological Object is generated by at least one Geological Process. Examples: a crystal, a nodule, a sedimentary layer, a metamorphic geobody, a tectonic plate."
      - label: "Geological Process"
        iri_fragment: "GEOCORE_0000002"
        metatypes: [Process, Occurrent]
        llm_definition: "It is a physical, chemical or biological process or series of processes that generate, destroy or modify the shape, the composition or the arrangement of at least one Geological Object. Examples: sedimentation, erosion, folding, diagenesis, petroleum migration."
      - label: "Geological Age"
        iri_fragment: "GEOCORE_0000003"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "Geological Age is a Quality of Geological Object related to a Geological Time Interval during which some Geological Process operated. The age of a Geological Object is the age of the process that generated this object. Examples: -57 million years, Oxfordian."
      - label: "Geological Structure"
        iri_fragment: "GEOCORE_0000004"
        metatypes: [GenericallyDependentContinuant, Continuant]
        llm_definition: "Geological Structure is a Generically Dependent Continuant which describes the internal arrangement of a Geological Object, i.e., the configuration and the mutual relationships of its different parts. Examples: fold, fault, cross-stratification, flute cast, delta structure."
      - label: "Geological Time Interval"
        iri_fragment: "GEOCORE_0000005"
        metatypes: [TemporalRegion, Occurrent]
        llm_definition: "Geological Time Interval is a Temporal Region of finite or zero dimension within the Global Geological Time. A Geological Time Interval may be occupied by one or several Geological Processes. Examples: period of -57 to -57 million years, the Oxfordian period."
      - label: "Earth Material"
        iri_fragment: "GEOCORE_0000006"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "Earth Material is a natural amount of matter, solid, fluid or unconsolidated, generated by a Geological Process. Earth Material is rigid and provides its own identity, but holds no unity criteria. Example: the solid material of which a petroleum reservoir is constituted and the fluids present in its pores."
      - label: "Rock"
        iri_fragment: "GEOCORE_0000008"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "Rock is a solid consolidate Earth Material, made of polycrystalline, monocrystalline or amorphous mineral matter or material of biological origin. Rock is defined at a scale of observation that is such that it can be considered homogeneous even when it is constituted by an aggregate of particles. Examples of instances: the limestone that constitutes a sedimentary layer, the sandstone that constitutes a thin section."
      - label: "Earth Fluid"
        iri_fragment: "GEOCORE_0000009"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Earth Material that represents a volume of fluid. Earth Fluids can be water, oil, gas or a mixture of those. Example: petroleum oil and gas."
      - label: "Geological Boundary"
        iri_fragment: "GEOCORE_0000011"
        metatypes: [ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Geological Boundary is a Continuant Fiat-Boundary corresponding to a physical discontinuity of any nature, located on the external surface of a Geological Object. Examples: twinning plane in a crystal, top or bottom boundaries of a layer, outer boundary of a batholith."
      - label: "Geological Contact"
        iri_fragment: "GEOCORE_0000012"
        metatypes: [RelationalQuality, Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "Geological Contact is a Relational Quality which relates two Geological Objects having the same dimension (1D, 2D or 3D), whose external boundaries are adjacent to each other. Examples: contact between two crystals, or between two sedimentary layers, between the hanging wall and foot wall of a fault."

  # ─────────────────────────────────────────────────────────────────────
  georeservoir:
    display_name: "GeoReservoir"
    owl: "resources/geores-full.owl"
    namespace: "https://www.inf.ufrgs.br/bdi/ontologies/"
    prefix: "georeservoir"
    eval_tier: "georeservoir"
    classes:
      - label: "Body of Rock"
        iri_fragment: "GEORES_0000001"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Geological Object constituted by some amount of rock or sediment, recognizable as a discrete physical body in a geological setting."
      - label: "Stratigraphic Unit"
        iri_fragment: "GEORES_0000002"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Body of Rock distinguished from adjacent rock bodies by some unifying property (lithology, fossil content, magnetic signature, etc.), used as the basic mappable element of stratigraphy."
      - label: "Lithostratigraphic Unit"
        iri_fragment: "GEORES_0000003"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Stratigraphic Unit defined by its lithology and stratigraphic position, regardless of inferred geological age. Formations, Members, and Groups are common ranks."
      - label: "Formation"
        iri_fragment: "GEORES_0000004"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Lithostratigraphic Unit of formal rank, distinguished by lithology and traceability across a mapped region; the fundamental unit of formal lithostratigraphic classification."
      - label: "Architectural Element"
        iri_fragment: "GEORES_0000006"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Body of Rock that represents a building block of a depositional system, recognizable in a mapping scale of at least 1:1000 m."
      - label: "Channel Unit"
        iri_fragment: "GEORES_0000008"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An elongated Architectural Element bounded by some Channel Surface and constituted by some Sediment or Sedimentary Rock that fills it."
      - label: "Levee Unit"
        iri_fragment: "GEORES_0000013"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Architectural Element having a wedge-shaped geometry that forms a bank or ridge along the margins of a Channel Unit."
      - label: "Lobe Unit"
        iri_fragment: "GEORES_0000014"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Architectural Element having a lobate three-dimensional geometry, typically formed by sediment deposition at the unconfined terminus of a channel system."
      - label: "Mound Unit"
        iri_fragment: "GEORES_0000015"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Architectural Element having a mound-shaped geometry with an irregular top surface and internal chaotic facies."
      - label: "Fossil"
        iri_fragment: "GEORES_0000018"
        metatypes: [Object, MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A preserved Body of Rock or trace of an ancient organism (e.g., bones, shells, casts, tracks) embedded in a sedimentary deposit."
      - label: "Depositional System"
        iri_fragment: "GEORES_0000020"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Object Aggregate whose members are mereotopologically linked Architectural Elements."
      - label: "Sedimentary Environment"
        iri_fragment: "GEORES_0000021"
        metatypes: [Site, ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "The specific depositional setting of a particular sedimentary rock, unique in terms of physical, chemical, and biological characteristics."
      - label: "Dimension"
        iri_fragment: "GEORES_0000022"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A Quality that inheres in an Independent Continuant by virtue of one of its one-dimensional extents (e.g., width, length, thickness), expressed by a numerical value and a measurement unit."
      - label: "Geometry"
        iri_fragment: "GEORES_0000023"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A Quality that inheres in a Body of Rock by virtue of its external three-dimensional shape, abstracting and simplifying its precise mathematical specifications."
      - label: "Lithology"
        iri_fragment: "GEORES_0000024"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A Quality of a Body of Rock describing its mineralogical composition, texture, and other macroscopic physical characteristics observable in the field or in core."
      - label: "Sinuosity"
        iri_fragment: "GEORES_0000027"
        metatypes: [Quality, SpecificallyDependentContinuant, Continuant]
        llm_definition: "A Quality that inheres in a Channel Unit by virtue of how wavy it is across its length, expressed by a real number given by its curved length divided by its length in a straight line."
      - label: "Facies"
        iri_fragment: "GEORES_0000028"
        metatypes: [GenericallyDependentContinuant, Continuant]
        llm_definition: "A visual pattern of properties of Bodies of Rock."
      - label: "Sedimentary Facies"
        iri_fragment: "GEORES_0000029"
        metatypes: [GenericallyDependentContinuant, Continuant]
        llm_definition: "A Facies consisting of the sum of the sedimentological characteristics of Architectural Elements."
      - label: "Facies Association"
        iri_fragment: "GEORES_0000030"
        metatypes: [GenericallyDependentContinuant, Continuant]
        llm_definition: "A Generically Dependent Continuant that consists of a collective of Facies."
      - label: "Sediment"
        iri_fragment: "GEORES_0000031"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "An Unconsolidated Earth Material constituted by some collection of sedimentary grains or particles."
      - label: "Sedimentary Rock"
        iri_fragment: "GEORES_0000032"
        metatypes: [MaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Body of Rock constituted by some collection of sedimentary grains or particles."
      - label: "Channel Surface"
        iri_fragment: "GEORES_0000038"
        metatypes: [ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Geological Boundary that forms the basis of a Channel Unit, having a concave-up shape unless truncated by overlying depositional units."
      - label: "Basin"
        iri_fragment: "GEORES_0000039"
        metatypes: [Site, ImmaterialEntity, IndependentContinuant, Continuant]
        llm_definition: "A Site that forms a depressed region of the Earth's surface or subsurface where sediments accumulate, bounded by structural or topographic highs."

  # ─── Relation Ontology (RO) ────────────────────────────────────────────
  # Property-only ontology: provides ObjectProperties cross-referenced by
  # GeoCore, GeoReservoir, and the relations: block below. No classes.
  ro:
    owl: "resources/ro-core.owl"
    namespace: "http://purl.obolibrary.org/obo/"
    prefix: "obo"
    eval_tier: "ro"
    import_iri: null   # not imported into the generated ontology; properties
                       # are referenced by IRI only (RO is property-supplier)
    classes: []

# -------------------------------------------------------------------------
# Verifier prefix mapping — used by ontology_verifier.py (Step 7b)
# Keys must match the `ontologies:` keys above. Value is the IRI prefix used
# to classify an IRI's ontology source during structural analysis.
# -------------------------------------------------------------------------
verifier_prefixes:
  bfo: "http://purl.obolibrary.org/obo/"
  geo: "https://www.inf.ufrgs.br/bdi/ontologies/"
  presalt: "https://w3id.org/presalt-onto#"

# -------------------------------------------------------------------------
# BFO/RO relations, metatype groups, and mereology dispatch rules are shared
# with the new-domain template. Paths are relative to this config file.
# Only the 10 GeoCore/GeoReservoir relations are declared locally below.
# -------------------------------------------------------------------------
relation_defaults: "../_shared/bfo_ro_relations.yaml"

# -------------------------------------------------------------------------
# Object property constraints — domain / range / inverse / provenance
# Loaded by src.utils.relation_validator.PROPERTY_CONSTRAINTS via the
# ontology_config singleton. Entries are filtered at load time against
# `provenance_tiers_active` (env override: RELATION_PROVENANCE_TIERS).
#
# Provenance values (every entry MUST declare one — missing field raises):
#   owl_axiom        Property is declared in a local OWL file we load
#                    (bfo-core.owl, geocore-full.owl, geores-full.owl).
#   bfo_shape_axiom  Property is in the BFO 2020 spec but not in our local
#                    BFO file — included to enforce shape rules.
#   ro_release       Property is sourced from the published RO release
#                    (ro-core.owl). RO is a property-supplier ontology.
#   critic_minted    Property was invented by the `validate` step when no
#                    published property fit. Loaded from
#                    `output/validate_minted_properties.csv` on subsequent runs.
#
# Each entry's `notes` field is preserved for the audit report.
# -------------------------------------------------------------------------
relations:

  # ─── GeoCore (from geocore-full.owl) ────────────────────────────────
  generated_by:
    iri: "https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000013"
    domain: [INDEPENDENT_CONTINUANT]
    range: [PROCESS]
    inverse: null
    provenance: owl_axiom
    critic_menu: true
    notes: "SubPropertyOf participates_in. Domain is Earth Material ∪ Geological Object."
  generated_in:
    iri: "https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000014"
    domain: [INDEPENDENT_CONTINUANT]
    range: [TEMPORAL]
    inverse: null
    provenance: owl_axiom
    critic_menu: true
    notes: "The Geological Time Interval in which the object was generated."
  has_age:
