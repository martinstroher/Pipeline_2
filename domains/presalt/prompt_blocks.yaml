# =============================================================================
# Prompt blocks for the Pre-Salt domain.
#
# The prompt loader (`src/utils/prompt_loader.py`) substitutes every
# `<<key>>` marker in a prompt file with the value found here. Nested
# keys flatten with `_` (e.g. `domain.name` -> `<<domain_name>>`).
# Block values may reference other blocks; the loader resolves nested
# markers recursively and detects cycles.
#
# To retarget the pipeline to a new domain:
#   1. Copy this file into the new domain's directory.
#   2. Rewrite Section A (domain identity) and Section C (examples).
#   3. Personas in Section B almost never need editing — they read from
#      Section A via nested markers.
# The prompt files in `prompts/` should NOT need to be touched.
# =============================================================================

# ─── A. Domain identity ──────────────────────────────────────────────────────
# These five fields are the only mandatory edits when adopting a new domain.
# Everything else in this file references them.
domain:
  # Full noun phrase used in personas and titles.
  # e.g. "Pre-Salt petroleum geology", "Alzheimer pathway", "EU contract law"
  name: "Pre-Salt petroleum geology"

  # Slightly longer descriptive phrase. Used in deep-expertise personas.
  scope: "the carbonate reservoirs of the Brazilian Pre-Salt"

  # Short label used wherever the prompt text needs a brief domain reference.
  short_name: "Pre-Salt"

  # Upper-ontology stack (most specific → most generic) used in expert
  # personas and methodology prose. Keep in sync with `ontology_config.yaml`.
  upper_stack: "BFO, GeoCore, GeoReservoir"

  # Compact arrow chain used in methodology and precedence rules.
  waterfall: "GeoReservoir → GeoCore → BFO"


# ─── B. Personas ─────────────────────────────────────────────────────────────
# Composed from Section A via nested markers. Rarely edited.
personas:
  # Used by extraction and NLD generation — domain expert framing.
  domain_expert: "You are a senior expert in <<domain_scope>> and ontology engineering."

  # Used by extraction — adds the specific scope upfront.
  domain_extractor: "You are a senior expert in <<domain_scope>>. Your task is to extract core domain concepts from scientific texts suitable for building a domain ontology. This ontology's primary purpose is to help researchers describe and compare analog settings."

  # Used by categorization, taxonomy, relation extraction — engineer with
  # foundational-ontology depth.
  upper_ontologist: "You are an expert ontology engineer with deep expertise in foundational ontology (<<domain_upper_stack>>) applied to <<domain_scope>>."

  # Used by the critic — extends the engineer with auditor framing.
  critic_auditor: "<<personas_upper_ontologist>> You are reviewing one category of a candidate ontology generated by an LLM pipeline. Your job is to spot rows that are clearly wrong, redundant, or vacuous and propose precise edits. Default to KEEP — only drop or fix rows when you can give a concrete, defensible reason."

  # Used by CQ scoring — narrow scope-auditor framing.
  scope_auditor: "You are an ontology scope auditor for a <<domain_name>> ontology. Your job is to determine which competency questions (if ANY) each term is relevant to."


# ─── C. Worked examples and domain-specific lists ────────────────────────────
# The bulk of the per-domain editing effort. Each block is dropped verbatim
# into one prompt file. Rewrite these when adopting a new domain — examples
# ground the LLM's interpretation of the abstract criteria.
examples:

  # ── term_extraction.txt ──────────────────────────────────────────────────
  term_extraction_focus: "Identify *types* or *classes* of entities relevant to <<domain_scope>>."

  term_extraction_normalization: '"carbonates" -> "Carbonate", "faults" -> "Fault"'

  term_extraction_exclusions: |
    * Highly specific identifiers with no ontological value: individual well names (e.g., 'Well 1-BRSA-123'), author names, company names.
        * Units of measure, numerical values, and codes (e.g., 'mD', 'API', '10%', 'SiO2').
        * Analytical methods, laboratory techniques, or observational instruments (e.g., 'Thin Section', 'Core Plug', 'Seismic Survey', 'Well Log').

  term_extraction_inclusions: "Note: Named petroleum fields (e.g., 'Lula Field', 'Búzios'), basin names (e.g., 'Santos Basin'), and named geological formations ARE valid — extract them. They will be classified as OWL named individuals downstream."

  term_extraction_named_individuals: "Note: named geological time periods (e.g., Aptian, Cretaceous) are valid and should be extracted — they will be classified as OWL individuals downstream."

  term_extraction_output: '["Microbial Carbonate", "Diagenesis", "Source Rock", "Structural Trap", "Porosity", "Lacustrine Environment", "Diagenetic Alteration"]'


  # ── nld_generation.txt ───────────────────────────────────────────────────
  # Three worked Aristotelian definitions. Two demonstrate context-grounded
  # generation; one demonstrates the no-context fallback.
  nld_generation: |
    Term: "Grainstone"
    Context: [paper.md > Carbonate Classification] Grainstones are grain-supported carbonate rocks lacking mud matrix...
    Output: {{"Definition": "Grainstone is a grain-supported sedimentary carbonate rock that is characterized by the absence of micrite matrix, with grains typically consisting of allochems such as bivalves, ostracods, gastropods, ooids, or intraclasts.", "Context_Used": true}}

    Term: "Coquina"
    Context: [paper.md > Reservoir Facies] Coquinas from the Santos Basin are bioclastic carbonates composed predominantly of bivalve shells...
    Output: {{"Definition": "Coquina is a sedimentary rock that is primarily composed of accumulated mollusk shells (bivalves and gastropods) and their fragments, deposited in brackish to saline lacustrine environments, commonly occurring as fragmented shell beds and serving as a significant reservoir rock type.", "Context_Used": true}}

    Term: "Dolomitization"
    Context: No additional context available.
    Output: {{"Definition": "Dolomitization is a diagenetic process that replaces calcium carbonate minerals with dolomite through the substitution of calcium ions by magnesium ions from Mg-rich fluids, commonly occurring in burial or hydrothermal settings and frequently enhancing reservoir porosity and permeability.", "Context_Used": false}}


  # ── term_categorization.txt ──────────────────────────────────────────────
  # Numbered methodology steps that walk the LLM down the upper-ontology
  # waterfall. When the domain has N tiers, write N numbered lines.
  categorization_waterfall_steps: |
    3.  **Prioritize GeoReservoir:** First, attempt to classify the term into one of the `### GeoReservoir Categories`.
    4.  **Fallback to GeoCore:** If and only if no GeoReservoir category is a good fit, then attempt to classify it into one of the `### GeoCore Categories`.
    5.  **Fallback to BFO:** If and only if no GeoCore category fits, then attempt to classify it into one of the `### BFO Categories`.

  # Hint pointing the LLM at a sensible non-trivial category for
  # analytical/methodological terms before resorting to NOT_CLASSIFIED.
  categorization_fallback_hint: "Reserve NOT_CLASSIFIED for physical analytical instruments treated as objects (e.g., 'Microscope'). Characterization methods and analytical processes that describe domain observations or workflows (e.g., 'Petrographic Analysis', 'Core Analysis') may fit 'Geological Process' in GeoCore — prefer a real category over NOT_CLASSIFIED when the NLD describes a domain action, observation, or property."

  # Three worked classification examples — one per upper-ontology tier.
  term_categorization: |
    Input:  [{{"term": "Grainstone",
              "nld": "Grainstone is a grain-supported sedimentary carbonate rock that lacks micrite matrix, with allochems typically consisting of bivalves, ostracods, or ooids."}}]
    Output: [{{"term": "Grainstone",
              "category": "Sedimentary Rock",
              "reasoning": "Directly describes a type of sedimentary rock classified under GeoReservoir."}}]

    Input:  [{{"term": "Normal Fault",
              "nld": "Normal Fault is a geological structure formed by extensional tectonics where the hanging wall moves down relative to the footwall along a dip-slip fault plane."}}]
    Output: [{{"term": "Normal Fault",
              "category": "Geological Structure",
              "reasoning": "Describes the internal structural arrangement of a geological object, fitting GeoCore."}}]

    Input:  [{{"term": "Core Sample"}}]
    Output: [{{"term": "Core Sample",
              "category": "NOT_CLASSIFIED",
              "reasoning": "Analytical instrument used to characterize formations, not an ontological domain concept."}}]

  # Condition-D counterparts to the production examples. Only the
  # representation field changes from `nld` to raw retrieved `context`.
  raw_context_categorization: |
    Input:  [{{"term": "Grainstone",
              "context": "Grainstones are grain-supported sedimentary carbonate rocks that lack micrite matrix and commonly contain bivalves, ostracods, or ooids."}}]
    Output: [{{"term": "Grainstone",
              "category": "Sedimentary Rock",
              "reasoning": "Directly describes a type of sedimentary rock classified under GeoReservoir."}}]

    Input:  [{{"term": "Normal Fault",
              "context": "Normal faults are geological structures formed by extensional tectonics where the hanging wall moves down relative to the footwall."}}]
    Output: [{{"term": "Normal Fault",
              "category": "Geological Structure",
              "reasoning": "Describes the internal structural arrangement of a geological object, fitting GeoCore."}}]

    Input:  [{{"term": "Core Sample"}}]
    Output: [{{"term": "Core Sample",
              "category": "NOT_CLASSIFIED",
              "reasoning": "Analytical instrument used to characterize formations, not an ontological domain concept."}}]


  # ── taxonomy_building.txt ────────────────────────────────────────────────
  # Shared-genus example showing when to invent an intermediate class.
  taxonomy_shared_genus: |
    Example — given two terms in the group:
           * "Dolomitization" NLD: "Dolomitization is a **diagenetic process** that replaces calcite..."
           * "Dissolution" NLD: "Dissolution is a **diagenetic process** that removes carbonate..."
         → Both share the genus "diagenetic process" → create "Diagenetic Process" as intermediate, with both as children.
         → If only "Dolomitization" were in the group, attach it directly to "{category}" — do NOT create "Diagenetic Process" for a single term.

  # Class-vs-individual rule. The named-individual examples are intrinsically
  # domain-specific (formations, basins, fields, time periods).
  taxonomy_individual_types: |
    The following are INDIVIDUALS (named instances) → use relationship_type = "rdf:type":
         - Named geological time periods (e.g., "Cretaceous", "Aptian", "Albian", "Pre-Salt")
         - Named petroleum fields (e.g., "Lula Field", "Búzios Field", "Tupi")
         - Named basins (e.g., "Santos Basin", "Campos Basin")
         - Named geological formations (e.g., "Barra Velha Formation", "Itapema Formation")
       General types/kinds (e.g., "Grainstone", "Fault", "Porosity", "Carbonate Reservoir") are CLASSES → use relationship_type = "rdfs:subClassOf".

  # Case-convention note for intermediate-class naming.
  taxonomy_case_note: "BFO canonical labels are ALL LOWERCASE (e.g., \"process\", \"quality\", \"entity\"). GeoCore and GeoReservoir canonical labels use Title Case (e.g., \"Geological Object\"). Use the EXACT case as listed in the canonical vocabulary below; do NOT apply Title Case to BFO entries."


  # ── relation_extraction.txt ──────────────────────────────────────────────
  # The closed-vocabulary table the LLM sees. Most rows are universal
  # BFO/RO; the last two reference domain-specific concepts (geological
  # time interval, geological age) and should be rewritten per domain.
  relation_property_table: |
    | Property | Domain → Range | When to use |
    |---|---|---|
    | has_part | whole → part (same kind) | "composed of", "consists of", "contains" — both must be continuants OR both occurrents |
    | part_of | part → whole (same kind) | "component of", "included in" |
    | has_participant | process → thing involved | "involves", "acts on", "uses" |
    | participates_in | thing → process it is involved in | "undergoes", "subject to" |
    | occurs_in | process → place/material where it happens | "takes place in", "within" |
    | located_in | thing → place it is inside | "found in", "situated in", "within" |
    | derives_from | new material → old material it came from | "formed from", "originates from", "product of" |
    | derives_into | old material → new material it becomes | "transforms into", "altered to" |
    | generated_by | thing → process that created it | "formed by", "produced by", "result of" |
    | constituted_by | material entity → material it is made of | "composed of" (material composition), "made of" |
    | has_quality | thing → its measurable property | "has property", "characterized by" (for qualities) |
    | inheres_in | quality/property → thing it belongs to | "property of", "characteristic of" |
    | preceded_by | event → earlier event | "follows", "after", "subsequent to" |
    | precedes | event → later event | "before", "prior to", "followed by" |
    | generated_in | thing → geological time interval | "deposited during", "formed in the" (time) |
    | has_age | geological object → its geological age | "dates to", "age is" |

  # Three worked relation extractions — process, no-relation, quality.
  relation_extraction: |
    Input: [{{"term": "dolomitization", "nld": "Dolomitization is a diagenetic process that involves the replacement of calcite by dolomite."}}]
    Output:
    ```json
    [{{"term": "dolomitization", "relations": [
      {{"property": "has_participant", "filler": "calcite", "confidence": 1.0, "evidence": "involves the replacement of calcite by dolomite"}},
      {{"property": "has_participant", "filler": "dolomite", "confidence": 1.0, "evidence": "involves the replacement of calcite by dolomite"}}
    ]}}]
    ```

    Input: [{{"term": "lacustrine environment", "nld": "Lacustrine environment is a continental depositional setting associated with lake systems."}}]
    Output:
    ```json
    [{{"term": "lacustrine environment", "relations": []}}]
    ```

    Input: [{{"term": "porosity", "nld": "Porosity is a physical property of rock defined as the ratio of void space to total rock volume."}}]
    Output:
    ```json
    [{{"term": "porosity", "relations": [
      {{"property": "inheres_in", "filler": "rock", "confidence": 1.0, "evidence": "physical property of rock"}}
    ]}}]
    ```


  # ── critic_taxonomy.txt + critic_relations.txt ─────────────────────────────────────────────
  # Note describing which named individuals must never be dropped.
  critic_named_individuals: "named formations, basins, fields, geological time periods"


  # ── cq_scoring.txt ───────────────────────────────────────────────────────
  # The list of competency questions the ontology aims to answer.
  # Editing these is the heart of CQ-driven refinement (Step 5b).
  cq_questions: |
    CQ1  — What are the geological objects of the Pre-Salt domain?
    CQ2  — What earth materials constitute the Pre-Salt geological objects?
    CQ3  — What geological structures occur in the Pre-Salt geological objects?
    CQ4  — What post-depositional processes and structures occur in the Pre-Salt geological objects?
    CQ5  — What are the spatial relations and arrangements in the Pre-Salt domain?
    CQ6  — What are the dimensions and positions of the Pre-Salt geological objects?
    CQ7  — What types of boundaries exist and where are they in the Pre-Salt geological objects?
    CQ8  — What deposits and stratigraphic units are associated with Pre-Salt reservoirs?
    CQ9  — What are the petrophysical characteristics of Pre-Salt reservoirs?
    CQ10 — What geological age is associated with the Pre-Salt reservoir intervals?

  # Comma-separated identifiers — must match the CQ numbers above exactly.
  cq_identifiers: "CQ1, CQ2, CQ3, CQ4, CQ5, CQ6, CQ7, CQ8, CQ9, CQ10"

  # Four worked relevance-judgement examples — one positive, one with
  # multiple CQs, one negative (method), one positive (constituent).
  cq_scoring: |
    - "porosity" (quality, def: "Porosity is a fundamental rock property that quantifies the void space..."): ["CQ9"] — it IS a petrophysical characteristic
    - "Barra Velha Formation" (Depositional Unit, def: "The Barra Velha Formation is an Aptian-age geological formation..."): ["CQ8", "CQ10"] — it IS a stratigraphic unit (CQ8) AND its definition specifies Aptian age (CQ10)
    - "seismic interpretation" (method, def: "Seismic interpretation is a workflow..."): [] — it's a method, not a geological entity
    - "dolomite" (Earth Material, def: "Dolomite is a carbonate mineral..."): ["CQ2"] — it IS an earth material that constitutes Pre-Salt objects

  # Example output rows (JSON, with str.format-escaped braces).
  cq_scoring_output: |
    [
      {{"term": "fracture", "relevant_cqs": ["CQ3"], "reasoning": "A structural discontinuity is a geological structure that occurs in Pre-Salt objects."}},
      {{"term": "well log", "relevant_cqs": [], "reasoning": "A measurement tool/method, not a geological entity the CQs ask about."}}
    ]
