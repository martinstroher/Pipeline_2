version: "0.2"
release_status: provisional
display_name: "GeoPreSalt 0.2"
defect_set:
  - F020
  - F021
  - F026
  - F028
  - F029
  - F031
  - F032
  - F035
  - F036
  - F044
  - F046
critic:
  kind: machine_geologist_critic
  persona_source: "../prompt_blocks.yaml"
  human_expert: false
  approval_inherited_from_0_1: false
policies:
  orphaned_demotion_base: drop
  orphaned_demotion_reason: >
    Drop the proposed demotion axiom when its base class was removed. Re-anchoring
    without a persisted surviving-ancestor decision would create a new geological
    claim that the frozen critic did not review.
  tier_c: defer_when_no_reviewed_safe_axiom
decision_files:
  - "geopresalt_0_2_demotions.csv"
decisions:
  - id: PIPE-F044
    defect_id: F044
    action: pipeline_fix
    subject: iri_minting
    resolution: normalize Unicode labels to ASCII before CamelCase minting
    critic_verdict: NOT_APPLICABLE
    critic_reasoning: This is an identifier hygiene mechanism, not a geological judgment.
    confidence: final
    justification: Preserves readable stable local names for accented labels in any domain.
    status: fixed
  - id: PIPE-F032
    defect_id: F032
    action: pipeline_fix
    subject: public_comments
    resolution: emit NLDs or clean label-based comments and retain critic text only in evidence
    critic_verdict: NOT_APPLICABLE
    critic_reasoning: This separates public ontology annotations from internal workflow evidence.
    confidence: final
    justification: Prevents implementation directives from leaking into public comments.
    status: fixed
  - id: PIPE-F031
    defect_id: F031
    action: pipeline_fix
    subject: imports_and_property_labels
    resolution: emit configured imports and labels for every used object property
    critic_verdict: NOT_APPLICABLE
    critic_reasoning: Import and label completeness is a pipeline concern.
    confidence: final
    justification: Lets consumers resolve upper-ontology semantics without local domain or range copies.
    status: fixed
  - id: COH-001
    defect_id: F028,F029
    action: drop_restriction
    subject: vug
    predicate: generated_by
    object: dissolution
    resolution: drop the incompatible existential restriction
    critic_verdict: ACCEPT
    critic_reasoning: A vug is an immaterial pore site formed through dissolution, but the configured generated_by property is restricted to material geological objects and earth materials.
    confidence: provisional
    justification: Retains vug as a pore site and avoids asserting a property outside its published domain.
    status: fixed
  - id: COH-002
    defect_id: F028,F029
    action: drop_restriction
    subject: micropore
    predicate: generated_by
    object: dissolution
    resolution: drop the incompatible existential restriction
    critic_verdict: ACCEPT
    critic_reasoning: A micropore is an immaterial pore site. Its origin may involve dissolution, but generated_by is constrained to material entities in GeoCore.
    confidence: provisional
    justification: Preserves the pore classification without changing the upper property semantics.
    status: fixed
  - id: COH-003
    defect_id: F028
    action: drop_restriction
    subject: graben
    predicate: has_continuant_part
    object: normal fault
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: A graben is a fault-bounded depressed site. A fault is a geological structure pattern, not a continuant part that an immaterial site can bear under BFO mereology.
    confidence: provisional
    justification: Keeps the graben and half-graben hierarchy while avoiding a category-invalid part assertion.
    status: fixed
  - id: COH-004
    defect_id: F028
    action: drop_restriction
    subject: in situ facies
    predicate: has_continuant_part
    object: spherulite
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: Facies is modeled as a generically dependent pattern and cannot bear material grains as continuant parts.
    confidence: provisional
    justification: The constituent statement belongs on a material facies bearer, not on the facies pattern.
    status: fixed
  - id: COH-005
    defect_id: F028
    action: drop_restriction
    subject: in situ facies
    predicate: has_continuant_part
    object: shrub
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: Facies is modeled as a generically dependent pattern and cannot bear material growth forms as continuant parts.
    confidence: provisional
    justification: The constituent statement belongs on a material facies bearer, not on the facies pattern.
    status: fixed
  - id: COH-006
    defect_id: F028
    action: drop_restriction
    subject: muddy spherulitestone
    predicate: has_continuant_part
    object: mud
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: This class inherits the facies pattern branch, so a material mud part creates the same BFO category clash.
    confidence: provisional
    justification: Avoids treating a facies pattern as a material whole.
    status: fixed
  - id: COH-007
    defect_id: F028
    action: drop_restriction
    subject: muddy spherulitestone
    predicate: has_continuant_part
    object: spherulite
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: This class inherits the facies pattern branch, so a material grain part creates the same BFO category clash.
    confidence: provisional
    justification: Avoids treating a facies pattern as a material whole.
    status: fixed
  - id: COH-008
    defect_id: F028
    action: drop_restriction
    subject: rework facies
    predicate: has_continuant_part
    object: intraclast
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: Rework facies is modeled as a generically dependent facies pattern and cannot bear material clasts as continuant parts.
    confidence: provisional
    justification: Retains the facies concept while removing a category-invalid material part.
    status: fixed
  - id: COH-009
    defect_id: F028
    action: drop_restriction
    subject: reworked carbonate
    predicate: has_continuant_part
    object: spherulite
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: This class is placed under the facies pattern branch, so a material grain part is incompatible with its current ontological category.
    confidence: provisional
    justification: Avoids changing the frozen taxonomy beyond the smallest coherent correction.
    status: fixed
  - id: COH-010
    defect_id: F028
    action: drop_restriction
    subject: reworked carbonate
    predicate: has_continuant_part
    object: shrub
    resolution: drop the incompatible continuant-part restriction
    critic_verdict: ACCEPT
    critic_reasoning: This class is placed under the facies pattern branch, so a material growth-form part is incompatible with its current ontological category.
    confidence: provisional
    justification: Avoids changing the frozen taxonomy beyond the smallest coherent correction.
    status: fixed
  - id: COH-011
    defect_id: F028
    action: reparent_class
    subject: basement high
    predicate: rdfs:subClassOf
    object: structural high
    replacement_object: Body of Rock
    resolution: model the basement high as a material body of rock
    critic_verdict: ACCEPT
    critic_reasoning: A basement high denotes a physical elevated basement block, while the current structural-high parent is modeled as an informational geological structure.
    confidence: provisional
    justification: Makes the retained continuant-part-of-basement statement compatible with BFO.
    status: fixed
  - id: COH-012
    defect_id: F028
    action: replace_equivalent_genus
    subject: basement high
    predicate: owl:equivalentClass
    object: structural high
    replacement_object: Body of Rock
    resolution: replace the defined-class genus with Body of Rock
    critic_verdict: ACCEPT
    critic_reasoning: The definition should describe a material basement body, not an abstract structural pattern.
    confidence: provisional
    justification: Keeps the part-of-basement differentia while removing the category contradiction.
    status: fixed
  - id: COH-013
    defect_id: F028
    action: reparent_class
    subject: continental margin
    predicate: rdfs:subClassOf
    object: Geological Structure
    replacement_object: site
    resolution: model the continental margin as a site
    critic_verdict: ACCEPT
    critic_reasoning: The continental margin is a spatial geological region that can contain or locate basins, not a generically dependent structural description.
    confidence: provisional
    justification: Makes the located-in relation from passive-margin basin compatible with BFO.
    status: fixed
  - id: GEO-F020-01
    defect_id: F020
    action: reparent_class
    subject: reservoir rock
    predicate: rdfs:subClassOf
    object: Sedimentary Rock
    replacement_object: Rock
    resolution: broaden the material genus from Sedimentary Rock to Rock
    critic_verdict: ACCEPT
    critic_reasoning: Reservoir behavior is a role or disposition of a rock body and does not require sedimentary origin.
    confidence: provisional
    justification: Implements the unanimous expert objection without restricting valid igneous or metamorphic reservoir rocks.
    status: fixed
  - id: GEO-F020-02
    defect_id: F020
    action: replace_equivalent_genus
    subject: reservoir rock
    predicate: owl:equivalentClass
    object: Sedimentary Rock
    replacement_object: Rock
    resolution: broaden the defined-class genus from Sedimentary Rock to Rock
    critic_verdict: ACCEPT
    critic_reasoning: The equivalent-class definition must match the broader primitive parent or the sedimentary restriction would remain logically inherited.
    confidence: provisional
    justification: Completes the unanimous expert correction in both asserted and defined semantics.
    status: fixed
  - id: GEO-F021-01
    defect_id: F021
    action: drop_restriction
    subject: mud
    predicate: constituted_by
    object: silica
    resolution: drop the universal-looking silica constitution claim
    critic_verdict: ACCEPT
    critic_reasoning: Mud may contain silica-bearing particles, but mud as a general sediment kind is not necessarily constituted by silica.
    confidence: provisional
    justification: Implements the unanimous expert rejection of this overgeneralized relation.
    status: fixed
  - id: CQ4-DEFER
    defect_id: F035,F036
    action: cq_deferred
    subject: CQ4
    resolution: retain NOT ANSWERABLE and defer connecting axioms
    critic_verdict: DEFER
    critic_reasoning: The frozen evidence does not identify a safe universal occurrence axiom linking every post-depositional process or structure to a material geological object.
    confidence: provisional
    justification: Preserves coherence and avoids inventing a universal geological claim.
    status: deferred
  - id: CQ6-DEFER
    defect_id: F035,F036
    action: cq_deferred
    subject: CQ6
    resolution: retain NOT ANSWERABLE and defer connecting axioms
    critic_verdict: DEFER
    critic_reasoning: Dimensions and positions require selected bearers and locations, but no reviewed universal pairs are present in the frozen inputs.
    confidence: provisional
    justification: Avoids fabricating object-to-quality or object-to-site links.
    status: deferred
  - id: CQ8-DEFER
    defect_id: F035,F036
    action: cq_deferred
    subject: CQ8
    resolution: retain NOT ANSWERABLE and defer connecting axioms
    critic_verdict: DEFER
    critic_reasoning: Association between stratigraphic units and reservoirs is context-specific and needs reviewed instance or class pairs.
    confidence: provisional
    justification: Avoids promoting an unreviewed domain association to a universal restriction.
    status: deferred
  - id: CQ10-DEFER
    defect_id: F035,F036
    action: cq_deferred
    subject: CQ10
    resolution: retain NOT ANSWERABLE and defer connecting axioms
    critic_verdict: DEFER
    critic_reasoning: Formation and interval ages require reviewed temporal links to named age individuals, which the frozen inputs do not provide.
    confidence: provisional
    justification: Avoids inventing age assignments and keeps Tier C behind the coherence gate.
    status: deferred
