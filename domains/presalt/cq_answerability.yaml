prefixes: |
  PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX owl: <http://www.w3.org/2002/07/owl#>
  PREFIX presalt: <https://w3id.org/presalt-onto#>
  PREFIX geo: <https://www.inf.ufrgs.br/bdi/ontologies/>
  PREFIX obo: <http://purl.obolibrary.org/obo/>
questions:
  - id: CQ1
    question: What are the geological objects of the Pre-Salt domain?
    mode: enumeration
    inventory_query: |
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT DISTINCT ?entity WHERE {
        ?entity (rdf:type|rdfs:subClassOf)/rdfs:subClassOf*
          <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> .
        FILTER(STRSTARTS(STR(?entity), "https://w3id.org/presalt-onto#"))
      }
  - id: CQ2
    question: What earth materials constitute the Pre-Salt geological objects?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?subject ?filler WHERE {
        ?subject rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> ;
                 rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000017> ;
          owl:someValuesFrom ?filler .
        ?filler rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000006> .
      }
    absent_relation_pattern: geological object constituted by earth material
  - id: CQ3
    question: What geological structures occur in the Pre-Salt geological objects?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?structure ?object WHERE {
        ?structure rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000004> ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?object .
        VALUES ?property {
          <http://purl.obolibrary.org/obo/BFO_0000171>
          <http://purl.obolibrary.org/obo/BFO_0000176>
        }
        ?object rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> .
      }
    absent_relation_pattern: geological structure occurring in or forming part of a geological object
  - id: CQ4
    question: What post-depositional processes and structures occur in the Pre-Salt geological objects?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?feature ?object WHERE {
        VALUES ?postDepositionalRoot {
          <https://w3id.org/presalt-onto#DiageneticProcess>
          <https://w3id.org/presalt-onto#Stylolite>
        }
        ?feature rdfs:subClassOf* ?postDepositionalRoot ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?object .
        VALUES ?property {
          <http://purl.obolibrary.org/obo/BFO_0000171>
          <http://purl.obolibrary.org/obo/BFO_0000176>
          <http://purl.obolibrary.org/obo/BFO_0000117>
        }
        ?object rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> .
      }
    absent_relation_pattern: post-depositional process or structure occurring in a geological object
  - id: CQ5
    question: What are the spatial relations and arrangements in the Pre-Salt domain?
    mode: relations_exist
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?subject ?property ?filler WHERE {
        ?subject rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?filler .
        VALUES ?property {
          <http://purl.obolibrary.org/obo/BFO_0000171>
          <http://purl.obolibrary.org/obo/BFO_0000176>
          <http://purl.obolibrary.org/obo/BFO_0000178>
        }
        FILTER(STRSTARTS(STR(?subject), "https://w3id.org/presalt-onto#"))
      }
  - id: CQ6
    question: What are the dimensions and positions of the Pre-Salt geological objects?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?object ?property ?value WHERE {
        ?object rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?value .
        {
          VALUES ?property { <http://purl.obolibrary.org/obo/RO_0000086> }
          VALUES ?valueRoot {
            <https://www.inf.ufrgs.br/bdi/ontologies/GEORES_0000022>
            <https://www.inf.ufrgs.br/bdi/ontologies/GEORES_0000023>
          }
          ?value rdfs:subClassOf* ?valueRoot .
        } UNION {
          VALUES ?property { <http://purl.obolibrary.org/obo/BFO_0000171> }
          VALUES ?valueRoot {
            <http://purl.obolibrary.org/obo/BFO_0000029>
            <http://purl.obolibrary.org/obo/BFO_0000006>
          }
          ?value rdfs:subClassOf* ?valueRoot .
        }
      }
    absent_relation_pattern: geological object dimension or spatial position
  - id: CQ7
    question: What types of boundaries exist and where are they in the Pre-Salt geological objects?
    mode: relational
    inventory_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      SELECT DISTINCT ?boundary WHERE {
        VALUES ?root {
          <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000011>
          <http://purl.obolibrary.org/obo/BFO_0000140>
          <http://purl.obolibrary.org/obo/BFO_0000146>
        }
        ?boundary rdfs:subClassOf* ?root .
        FILTER(STRSTARTS(STR(?boundary), "https://w3id.org/presalt-onto#"))
      }
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?boundary ?object WHERE {
        ?boundary rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000011> ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty <http://purl.obolibrary.org/obo/BFO_0000171> ;
          owl:someValuesFrom ?object .
        ?object rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000001> .
      }
    absent_relation_pattern: boundary location in geological objects
  - id: CQ8
    question: What deposits and stratigraphic units are associated with Pre-Salt reservoirs?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?unit ?property ?reservoir WHERE {
        ?unit rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEORES_0000002> .
        ?unit rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?reservoir .
        VALUES ?reservoirRoot {
          <https://w3id.org/presalt-onto#HydrocarbonReservoir>
          <https://w3id.org/presalt-onto#ReservoirRock>
          <https://w3id.org/presalt-onto#CarbonateReservoir>
          <https://w3id.org/presalt-onto#ReservoirFacies>
        }
        ?reservoir rdfs:subClassOf* ?reservoirRoot .
      }
    absent_relation_pattern: association between a stratigraphic unit and a reservoir
  - id: CQ9
    question: What are the petrophysical characteristics of Pre-Salt reservoirs?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?reservoir ?quality WHERE {
        VALUES ?reservoirRoot {
          <https://w3id.org/presalt-onto#HydrocarbonReservoir>
          <https://w3id.org/presalt-onto#ReservoirRock>
          <https://w3id.org/presalt-onto#CarbonateReservoir>
          <https://w3id.org/presalt-onto#ReservoirFacies>
        }
        ?reservoir rdfs:subClassOf* ?reservoirRoot ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty <http://purl.obolibrary.org/obo/RO_0000086> ;
          owl:someValuesFrom ?quality .
        ?quality rdfs:subClassOf* <http://purl.obolibrary.org/obo/BFO_0000019> .
      }
    absent_relation_pattern: reservoir petrophysical quality
  - id: CQ10
    question: What geological age is associated with the Pre-Salt reservoir intervals?
    mode: relational
    answer_query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX owl: <http://www.w3.org/2002/07/owl#>
      SELECT DISTINCT ?interval ?property ?age WHERE {
        VALUES ?intervalRoot {
          <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000005>
          <https://www.inf.ufrgs.br/bdi/ontologies/GEORES_0000002>
        }
        ?interval rdfs:subClassOf* ?intervalRoot ;
          rdfs:subClassOf ?restriction .
        ?restriction a owl:Restriction ;
          owl:onProperty ?property ;
          owl:someValuesFrom ?age .
        ?age rdfs:subClassOf* <https://www.inf.ufrgs.br/bdi/ontologies/GEOCORE_0000003> .
      }
    absent_relation_pattern: interval-to-age or formation-to-age relation
