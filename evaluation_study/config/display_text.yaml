# Geologist-facing text for formal ontology labels used in expert workbooks.
# Formal identifiers remain available only in the private blinding key.

categories:
  object:
    display: "Physical object"
    definition: "A single physical thing with its own boundary, such as a rock body or geological structure."
    source: "BFO"
    example: "A discrete carbonate buildup or fault block."
    counterexample: "Porosity is a property; deposition is a process."
  object aggregate:
    display: "Group of physical objects"
    definition: "A collection of physical things considered together, such as an assemblage of grains."
    source: "BFO"
    example: "An assemblage of carbonate grains considered together."
    counterexample: "One grain is a physical object, not a group."
  quality:
    display: "Dependent property"
    definition: "A measurable or observable feature that exists only as a feature of something else."
    source: "BFO"
    example: "Porosity or permeability of a reservoir rock."
    counterexample: "The reservoir rock itself is not a dependent property."
  realizable entity:
    display: "Capacity, role, or function"
    definition: "A capacity, role, or function that can be realized under suitable conditions."
    source: "BFO"
    example: "The sealing role of a rock body or its capacity to transmit fluid."
    counterexample: "The rock body bearing the role or capacity is a physical object."
  site:
    display: "Spatial region or cavity"
    definition: "A bounded place, cavity, or occupied spatial region defined by surrounding material."
    source: "BFO"
    example: "A pore, cavity, or reservoir interval considered as a place."
    counterexample: "The rock surrounding a pore is material, not the spatial region itself."

properties:
  constituted_by: "is constituted by"
  continuant_part_of: "is a stable part of"
  derives_from: "derives from"
  derives_into: "develops into"
  generated_by: "is generated by"
  generated_in: "is generated in"
  has_age: "has geological age"
  has_continuant_part: "has stable part"
  has_disposition: "has the capacity to"
  has_occurrent_part: "includes process part"
  has_participant: "involves"
  has_quality: "has characteristic"
  has_role: "serves as"
  inheres_in: "is a characteristic of"
  located_in: "is located in"
  occurrent_part_of: "is a process part of"
  occurs_in: "occurs in"
  participates_in: "participates in"
  preceded_by: "is preceded by"
  precedes: "precedes"

defined_class_features:
  reservoir facies: "serves as a facies that identifies reservoir-bearing intervals"
  hydrocarbon reservoir: "stores and transmits producible hydrocarbons"
  seal: "impedes hydrocarbon migration"
  regional seal: "impedes hydrocarbon migration across a regional area"
  aquifer: "stores and transmits groundwater"
  source rock: "has the capacity to generate hydrocarbons"
  reservoir rock: "has the capacity to store and transmit hydrocarbons"
  lacustrine carbonate platform: "is a carbonate platform formed in a lake system"
  carbonate reservoir: "is a hydrocarbon reservoir hosted by carbonate rock"
  basement high: "is a structural high formed by or within basement rock"
  bioclast: "is a carbonate grain derived from fossil material"
  hydrothermal alteration: "is a diagenetic process involving hydrothermal fluid"
  silica cement: "is silica generated by cementation"

# These labels were interpreted in different senses during the AI usability pilot.
# Their first existing NLD sentence is shown as shared neutral context.
ambiguous_terms:
  - mound
  - carbonate
  - lacustrine carbonate
  - reservoir
  - rift
  - micrite
  - seismic facies
  - neobarremian
  - pre-salt section

term_glosses:
  reservoir: "A subsurface rock body that stores and transmits fluids; here the term refers to the geological body, not the fluid accumulation alone."