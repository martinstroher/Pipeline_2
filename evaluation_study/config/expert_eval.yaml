# Expert-Evaluation Study Configuration — PreSaltOntoLearn
#
# Instructions sheet rendered as the first tab of the expert-evaluation
# workbook produced by evaluation_study/expert_eval_generator.py. Each entry
# is a [Section, Details] pair shown verbatim.
#
# The workbook contains one instructions sheet, one representation sheet,
# one category sheet, and five final-ontology sheets. Only the prose lives
# here. Authors retargeting the pipeline rewrite this file to swap anchors
# and project name.
#
# Load order: src/utils/study_config.py reads this file and exposes
# `get_study_config().instruction_rows` to the workbook generator.

sheet_instructions:
  Category_Guide:
    title: "Category guide"
    task: "Use this sheet only when a category in Category Review is unfamiliar."
    guidance: "Each row explains a category in ordinary geological language and gives an example. You do not need to read or memorize the whole list."
    answer_cue: "This is a reference sheet. There is nothing to fill in here. Return to Category Review after checking the category you need."
  Representation:
    title: "Terms and definitions"
    task: "For each term, rate how relevant it is to Brazilian Pre-Salt geology. Then judge Definition 1 and Definition 2 separately and choose which definition is better."
    guidance: "For relevance and definition accuracy, 1 is the lowest rating and 5 is the highest. Judge each definition on its own before choosing 1, 2, Tie, or Unsure."
  Category_Correct:
    title: "Does the term fit the suggested category?"
    task: "Read the term's meaning and the suggested category. Decide whether the term fits that category."
    guidance: "Choose Yes when it fits, Partial when the category is close but too broad, too narrow, or incomplete, and No when it is the wrong kind of thing. The same term appears more than once because different systems suggested different categories."
  Taxonomy:
    title: "Broader and more specific terms"
    task: "First decide whether the more specific term really is a type of the broader term. Then decide whether keeping the more specific term is useful for Pre-Salt geology."
    guidance: "Example: grainstone is a type of sedimentary rock. A relationship can be wrong even when both terms are useful. You do not need to suggest another broader term."
  Defined_Classes:
    title: "Definition review"
    task: "Decide whether each definition is geologically correct for the term."
    guidance: "Choose Partly correct when the main idea is right but something important is wrong or missing. For Partly correct or Incorrect, choose the main problem. 'Wrong general type' means the definition starts by calling the term the wrong kind of thing, such as calling a structure a process."
  Relations:
    title: "Geological statement review"
    task: "Decide how accurately each sentence describes the relationship between the two geological terms."
    guidance: "Choose Generally true when the relationship normally holds, Context-specific when it holds only in some settings, Partly wrong when part of the statement is inaccurate, and Incorrect when the relationship is wrong. Judge the statement using your geological knowledge."
  Individuals:
    title: "Named items"
    task: "First decide whether the term names one specific basin, field, formation, time interval, structure, or other particular item. Then decide whether its suggested type is correct."
    guidance: "A named item is one particular thing with its own name, rather than a reusable kind that could describe many different things. Judge only the item shown in each row."
  Meaning_Preservation:
    title: "Removed or rewritten terms"
    task: "Compare the term's original meaning with how it is handled in the final model. First decide whether its geological meaning is still available. Then decide whether this treatment is suitable for the main Pre-Salt model."
    guidance: "The main model should contain the reusable concepts needed to compare Pre-Salt systems; narrow local details may stay in extensions. If meaning is only Mostly preserved or is lost, choose what should happen instead. You are judging geological content, not software or formal logic."
instructions_sheet:
  rows:
    - ["PreSaltOntoLearn Geological Review", ""]
    - ["", ""]
    - ["WHAT IS THIS REVIEW?", "This model was built automatically from scientific papers about Brazilian Pre-Salt geology. We need your geological judgment to check whether its terms, definitions, categories, and relationships make sense."]
    - ["WHAT SHOULD YOU DO?", "Work through each sheet and answer every red cell. Yellow cells are optional. Some terms appear more than once because different possible answers are being compared; review each row separately."]
    - ["HOW SHOULD YOU ANSWER?", "Choose the answer that best reflects your professional judgment. Choose Partial when something is broadly right but incomplete or imprecise. Choose Unsure when you do not have enough information or the question falls outside your expertise; it is better to choose Unsure than to guess."]
    - ["NOTES", "Notes are optional, but a short explanation is useful when you disagree with something."]
    - ["COMPLETING THE REVIEW", "You may complete the sheets in separate sessions. Before returning the workbook, check that no red cells remain."]
    - ["", ""]
    - ["THANK YOU", "Thank you for contributing your expertise."]
