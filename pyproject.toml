[project]
name = "presaltontolearn"
version = "0.0.0"
description = "Local environment for the PreSaltOntoLearn pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.60.0",
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.5.0",
    "onnxruntime>=1.30.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "rank-bm25>=0.2.0",
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=0.0.5",
    "rdflib>=7.0.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
reasoner = ["owlready2>=0.48"]
test = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.uv]
package = false
required-version = "==0.12.12"
default-groups = []
build-constraint-dependencies = ["setuptools==84.0.0"]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
